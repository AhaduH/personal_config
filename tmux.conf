# reload configuration
unbind r
bind r source-file ~/.tmux.conf \; display "config reloaded"

# terminal capabilities (preserve current Ghostty workaround for now)
#set -g default-terminal "$TERM"
set -g terminal-features "$TERM:RGB"

# numbering
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# window naming
# explicit names (editor/run) remain stable.
# unnamed windows can follow their running command.
setw -g automatic-rename on
setw -g allow-rename off

# preserve working directory when creating windows/panes
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# vim pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# usability
set -g mouse on
set -g history-limit 20000
set -g status-keys vi
set -g mode-keys vi

# --------------------------------------------------
# status bar — (vague-inspired)
# --------------------------------------------------

set -g status-position top
set -g status-justify absolute-centre
set -g status-style 'bg=default,fg=#878787'

# left: current project/session
set -g status-left-length 36
set -g status-left '#[fg=#aeaed1,bold] #S #[default]'

# centre: windows
setw -g window-status-format ' #I:#W#F '
setw -g window-status-current-format ' #I:#W '

setw -g window-status-style 'fg=#878787'
setw -g window-status-current-style 'fg=#b4d4cf,bold'

# right: intentionally empty
set -g status-right ''

# pane borders
set -g pane-border-style 'fg=#606079'
set -g pane-active-border-style 'fg=#9bb4bc'

